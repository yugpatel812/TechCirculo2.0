# TechCirculo Backend Configuration with Points System

server:
  port: 8084

spring:
  application:
    name: techcirculo-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/techcirculo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Jayn@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: false
    
  jpa:
    hibernate:
      ddl-auto: update  # Change to 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
  sql:
    init:
      mode: never  # Set to 'always' if you want to run schema.sql on startup
      schema-locations: classpath:schema.sql
      data-locations: classpath:sample-data.sql
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 849998462781-kv0gght1ksqc40qt8g81auksldesem01.apps.googleusercontent.com
            client-secret: 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
            scope: email,profile
            redirect-uri: http://localhost:8084/login/oauth2/code/google

  web:
    cors:
      allowed-origins: 
        - "http://localhost:3000"
        - "http://localhost:8084"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:8084"
      allowed-methods: 
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: 
        - "*"
      allow-credentials: true
    resources:
      static-locations: classpath:/static/,file:uploads/
      chain:
        strategy:
          content:
            enabled: true
            paths: "/**"
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  cache:
    type: simple  # Change to 'redis' if using Redis

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey12345678901234567890123456789012345678901234567890}
  expiration: 86400000  # 24 hours in milliseconds

# OAuth2 Configuration  
oauth2:
  success-redirect-url: ${SUCCESS_REDIRECT_URL:http://localhost:8084/dashboard.html}

# Points System Configuration
points:
  system:
    enabled: true
    level-calculation:
      points-per-level: 100
      bonus-multiplier: 10
    streak:
      reset-after-days: 2
      weekly-bonus: 50
    activities:
      post-created: 10
      post-liked: 2
      comment-created: 5
      comment-liked: 1
      profile-completed: 20
      daily-login: 1
      weekly-streak: 50
      event-attended: 25
      course-completed: 100
      level-up-bonus: 10
    badges:
      auto-award: true
      notification: true

# WebSocket Configuration
websocket:
  enabled: true
  endpoint: "/ws/points"
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:8084" 
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:8084"

# Logging Configuration
logging:
  level:
    org.yug.backend: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/techcirculo.log
    max-size: 10MB
    max-history: 30

# Management/Actuator Configuration  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,websockets
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Custom Application Info
info:
  app:
    name: TechCirculo Backend
    description: Backend API for TechCirculo platform with integrated points system
    version: 2.0
    features:
      - Community Management
      - User Profiles  
      - Posts & Comments
      - Real-time Points System
      - Achievement Badges
      - WebSocket Notifications
      - OAuth2 Authentication

# Database Connection Pool Configuration
hikari:
  connection-timeout: 20000
  idle-timeout: 600000
  max-lifetime: 1800000
  maximum-pool-size: 20
  minimum-idle: 5

# File storage configuration
file:
  upload-dir: ./uploads

# Cache Configuration added under main spring section above

# Development Profile Specific Configuration
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
logging:
  level:
    org.yug.backend: DEBUG
    org.springframework.web.socket: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile Specific Configuration  
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
logging:
  level:
    org.yug.backend: INFO
    org.springframework.web.socket: WARN
    org.hibernate.SQL: WARN